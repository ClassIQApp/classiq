name: CI

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-24.04

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm lint:check

            - run: pnpm check-types

            - run: pnpm test

    database-tests:
        runs-on: ubuntu-24.04

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_USER: classiq
                    POSTGRES_PASSWORD: classiq
                    POSTGRES_DB: classiq_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U classiq"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            TEST_UPLOAD_DATABASE_URL: postgres://classiq:classiq@localhost:5432/classiq_test
            AUTH_TEST_DATABASE_URL: postgres://classiq:classiq@localhost:5432/classiq_test

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm --filter @classiq/api exec vitest run --exclude src/core/processing/lecture-pipeline.test.ts
