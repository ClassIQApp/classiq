packages:
    - apps/*
    - tools/*

allowBuilds:
    esbuild: true

catalog:
    "@eslint/js": ^9.39.1
    "@hono/vite-dev-server": ^0.26.1
    "@trivago/prettier-plugin-sort-imports": ^6.0.2
    "@types/node": ^24.13.3
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.7
    "@vitejs/plugin-react": ^6.1.1
    aws-cdk: ^2.1143.0
    aws-cdk-lib: ^2.270.0
    constructs: ^10.8.1
    eslint: ^9.39.5
    eslint-config-prettier: ^10.1.8
    eslint-plugin-react: ^7.37.5
    eslint-plugin-react-hooks: ^5.2.0
    eslint-plugin-turbo: ^2.11.4
    eslint-plugin-unicorn: ^62.0.0
    globals: ^16.5.0
    husky: ^9.1.7
    hono: ^4.13.8
    lint-staged: ^17.5.1
    prettier: ^3.9.9
    react: ^19.2.8
    react-dom: ^19.2.8
    tsx: ^4.23.15
    turbo: ^2.11.4
    typescript: ~6.0.2
    typescript-eslint: ^8.70.1
