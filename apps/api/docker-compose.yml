services:
    postgres:
        image: postgres:latest
        restart: unless-stopped
        environment:
            POSTGRES_USER: classiq
            POSTGRES_PASSWORD: classiq
            POSTGRES_DB: classiq
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U classiq"]
            interval: 2s
            timeout: 3s
            retries: 15
        volumes:
            - classiq-postgres-data:/var/lib/postgresql

    minio:
        image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z@sha256:7bb2aff6b89efe1cb1303c10fc21d579447434ed06649ac9ec05a5e2dbf30ad7
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: classiq
            MINIO_ROOT_PASSWORD: classiq-local
            MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
        ports:
            - "127.0.0.1:9100:9000"
            - "127.0.0.1:9101:9001"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 2s
            timeout: 3s
            retries: 30
        volumes:
            - classiq-minio-data:/data

    elasticmq:
        image: softwaremill/elasticmq-native:latest
        restart: unless-stopped
        ports:
            - "127.0.0.1:9324:9324"
        volumes:
            - ./elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
    classiq-postgres-data:
    classiq-minio-data:
