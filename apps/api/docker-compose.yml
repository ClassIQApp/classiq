services:
    postgres:
        image: postgres:latest
        restart: unless-stopped
        environment:
            POSTGRES_USER: classiq
            POSTGRES_PASSWORD: classiq
            POSTGRES_DB: classiq
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U classiq"]
            interval: 2s
            timeout: 3s
            retries: 15
        volumes:
            - classiq-postgres-data:/var/lib/postgresql

volumes:
    classiq-postgres-data:
