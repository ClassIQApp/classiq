include classpath("application.conf")

node-address {
    protocol = http
    host = localhost
    port = 9324
    context-path = ""
}
rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
}
aws {
    region = us-east-1
    accountId = "000000000000"
}
queues {
    classiq-local {
        deadLettersQueue {
            name = "classiq-local-dead-letters"
            maxReceiveCount = 5
        }
    }
    classiq-local-dead-letters {}
}
